[package]
name         = "oxidized-mc-types"
version      = "0.1.0"
edition      = "2024"
authors      = ["Dogukan Metan <dogukanmetan@gmail.com>"]
license      = "MIT"
repository   = "https://github.com/oxidized-mc/mc-types"
homepage     = "https://github.com/oxidized-mc/mc-types"
rust-version = "1.85"
readme       = "README.md"
documentation = "https://docs.rs/oxidized-mc-types"
description  = "Minecraft game types — BlockPos, SectionPos, Vec3, Aabb, Direction, ResourceLocation, GameType, and more"
keywords     = ["minecraft", "oxidized-mc"]
categories   = ["game-development"]

[dependencies]
bytes         = "1"
oxidized-codec       = "0.1.0-dev"
oxidized-types       = "0.1.0-dev"
thiserror     = "2"

[dev-dependencies]
proptest = "1"
insta    = "1"

[lints.rust]
missing_docs   = "warn"
unsafe_code    = "deny"
unused_imports = "warn"

[lints.clippy]
# Correctness — hard errors
correctness                = { level = "deny", priority = -1 }
# Performance and style — warnings
perf                       = { level = "warn", priority = -1 }
style                      = { level = "warn", priority = -1 }
complexity                 = { level = "warn", priority = -1 }
suspicious                 = { level = "warn", priority = -1 }
# Specific useful lints
unwrap_used                = "deny"
expect_used                = "deny"
panic                      = "deny"
print_stdout               = "deny"
print_stderr               = "deny"
needless_pass_by_value     = "warn"
redundant_clone            = "warn"
# Noisy lints intentionally suppressed
module_name_repetitions    = "allow"
must_use_candidate         = "allow"
cast_possible_truncation   = "allow"
cast_sign_loss             = "allow"
cast_possible_wrap         = "allow"

[patch.crates-io]
oxidized-codec = { path = "../codec" }
oxidized-nbt = { path = "../nbt" }
oxidized-types = { path = "../types" }
